<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المراقبة الأبوية</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #eee; }
header { padding: 14px; background: #1b1b1b; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input, button { padding: 10px; border-radius: 8px; border: 1px solid #555; font-size: 15px; }
input { flex: 1; min-width: 200px; max-width: 300px; }
button { cursor: pointer; background: #00bcd4; color: #fff; font-weight: bold; border: none; transition: 0.3s; }
button:hover { background: #008ba3; }
#status { padding: 12px; background: #222; border-bottom: 1px solid #333; color: #ff9800; font-weight: bold; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; padding: 10px; }
.box { background: #181818; padding: 10px; border-radius: 10px; }
h3 { margin-top: 0; color: #00bcd4; }
video { width: 100%; background: #000; border-radius: 10px; display: block; }
#screenVideo { min-height: 300px; max-height: 75vh; }
#cameraVideo { min-height: 200px; max-height: 50vh; }
@media(max-width:800px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
    <input id="deviceId" placeholder="أدخل الكود السري للتابلت..." value="">
    <button id="connect">اتصال وبدء المراقبة</button>
</header>

<div id="status">غير متصل</div>

<div class="grid">
    <div class="box">
        <h3>الشاشة</h3>
        <video id="screenVideo" autoplay playsinline muted></video>
    </div>
    <div class="box">
        <h3>الكاميرا الأمامية</h3>
        <video id="cameraVideo" autoplay playsinline muted></video>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let socket = null;
let pc = null;
let pendingCandidates = [];

const statusDiv = document.getElementById("status");
const screenVideo = document.getElementById("screenVideo");
const cameraVideo = document.getElementById("cameraVideo");
const remoteAudio = document.getElementById("remoteAudio");

const SERVER = "https://signaling-server-1-zu27.onrender.com";

const rtcConfig = {
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

function setStatus(text) {
    statusDiv.textContent = text;
    console.log("[STATUS]", text);
}

function createPeer() {
    if (pc) { try { pc.close(); } catch (_) {} }
    pendingCandidates = [];
    pc = new RTCPeerConnection(rtcConfig);

    pc.ontrack = async (event) => {
        const track = event.track;
        if (track.kind === "video") {
            let stream = (event.streams && event.streams.length > 0) ? event.streams[0] : new MediaStream([track]);
            
            if (stream.id === "screenStream" || track.id === "screen") {
                screenVideo.srcObject = stream;
            }
            else if (stream.id === "cameraStream" || track.id === "camera") {
                cameraVideo.srcObject = stream;
            }
            else {
                if (!screenVideo.srcObject) screenVideo.srcObject = stream;
                else if (!cameraVideo.srcObject) cameraVideo.srcObject = stream;
            }
        }

        if (track.kind === "audio") {
            remoteAudio.srcObject = new MediaStream([track]);
        }
    };

    pc.onicecandidate = (event) => {
        if (event.candidate && socket && socket.connected) {
            socket.emit("message", {
                type: "candidate",
                candidate: event.candidate.candidate,
                sdpMid: event.candidate.sdpMid,
                sdpMLineIndex: event.candidate.sdpMLineIndex
            });
        }
    };

    pc.onconnectionstatechange = () => {
        if (!pc) return;
        if (pc.connectionState === "connected") setStatus("✅ تم الاتصال بالتابلت وبدء البث بنجاح");
        if (pc.connectionState === "failed") setStatus("❌ فشل اتصال WebRTC");
    };
}

async function addPendingCandidates() {
    if (!pc || !pc.remoteDescription) return;
    for (const candidate of pendingCandidates) {
        try { await pc.addIceCandidate(candidate); } catch (e) {}
    }
    pendingCandidates = [];
}

async function handleMessage(data) {
    try {
        if (data.type === "offer") {
            setStatus("استلام البث من التاب...");
            createPeer();
            await pc.setRemoteDescription({ type: "offer", sdp: data.sdp });
            await addPendingCandidates();
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit("message", { type: "answer", sdp: answer.sdp });
        }
        else if (data.type === "candidate") {
            const candidate = new RTCIceCandidate({
                candidate: data.candidate,
                sdpMid: data.sdpMid,
                sdpMLineIndex: data.sdpMLineIndex
            });
            if (pc && pc.remoteDescription) {
                try { await pc.addIceCandidate(candidate); } catch (e) {}
            } else {
                pendingCandidates.push(candidate);
            }
        }
        else if (data.type === "error") {
            setStatus("خطأ: " + data.message);
        }
    } catch (error) {
        setStatus("❌ WebRTC Error: " + error.message);
    }
}

document.getElementById("connect").onclick = () => {
    const id = document.getElementById("deviceId").value.trim();
    if (!id) return alert("اكتب الكود السري للتابلت أولاً");

    [remoteAudio, screenVideo, cameraVideo].forEach(media => {
        media.play().catch(e => console.log("تم تهيئة الميديا للاشتغال التلقائي"));
    });

    if (socket) { try { socket.disconnect(); } catch (_) {} }
    setStatus("جاري الاتصال بالسيرفر...");

    socket = io(SERVER, { transports: ["websocket"] });

    socket.on("connect", () => {
        socket.emit("join", { room: id, role: "viewer" });
        socket.emit("message", { type: "viewer-ready" });
        setStatus("متصل بالسيرفر؛ في انتظار التاب...");
    });

    socket.on("message", handleMessage);

    socket.on("disconnect", () => setStatus("انقطع اتصال السيرفر"));
    socket.on("connect_error", (error) => setStatus("❌ فشل الاتصال بالسيرفر"));
};
</script>
</body>
</html>
