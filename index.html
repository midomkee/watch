<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المراقبة</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#111;color:#eee}
header{padding:14px;background:#1b1b1b;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button{padding:10px;border-radius:8px;border:1px solid #555}
button{cursor:pointer}
#status{padding:10px;background:#222}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:10px}
video{width:100%;background:#000;border-radius:10px;max-height:70vh}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <input id="deviceId" placeholder="Device ID" value="tablet-a7-01">
  <button id="connect">اتصال</button>
  <button id="audio">تشغيل الصوت</button>
</header>
<div id="status">غير متصل</div>
<div class="grid">
  <div><h3>الشاشة</h3><video id="screen" autoplay playsinline></video></div>
  <div><h3>الكاميرا الأمامية</h3><video id="camera" autoplay playsinline muted></video></div>
</div>
<audio id="remoteAudio" autoplay></audio>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let socket, pc;
let pendingCandidates=[];
const statusDiv=document.getElementById("status");
const screenVideo=document.getElementById("screen");
const cameraVideo=document.getElementById("camera");
const remoteAudio=document.getElementById("remoteAudio");

const rtcConfig={
  iceServers:[
    {urls:"stun:stun.l.google.com:19302"}
    // Production: add your TURN server here.
  ]
};

function setStatus(s){statusDiv.textContent=s;}

function createPeer(){
  if(pc) pc.close();
  pc=new RTCPeerConnection(rtcConfig);

  pc.ontrack=async e=>{
    const track=e.track;
    if(track.kind==="video"){
      const stream=new MediaStream([track]);
      if(track.id==="screen") screenVideo.srcObject=stream;
      else if(track.id==="camera") cameraVideo.srcObject=stream;
    }else if(track.kind==="audio"){
      remoteAudio.srcObject=new MediaStream([track]);
      try{await remoteAudio.play();}catch(_){}
    }
  };

  pc.onicecandidate=e=>{
    if(e.candidate && socket){
      socket.emit("message",{
        type:"candidate",
        candidate:e.candidate.candidate,
        sdpMid:e.candidate.sdpMid,
        sdpMLineIndex:e.candidate.sdpMLineIndex
      });
    }
  };

  pc.onconnectionstatechange=()=>{
    setStatus("WebRTC: "+pc.connectionState);
  };
}

async function handleMessage(data){
  try{
    if(data.type==="offer"){
      createPeer();
      await pc.setRemoteDescription({type:"offer",sdp:data.sdp});
      for(const c of pendingCandidates) await pc.addIceCandidate(c);
      pendingCandidates=[];
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit("message",{type:"answer",sdp:answer.sdp});
      setStatus("تم إنشاء الاتصال");
    }else if(data.type==="candidate"){
      const c=new RTCIceCandidate({
        candidate:data.candidate,
        sdpMid:data.sdpMid,
        sdpMLineIndex:data.sdpMLineIndex
      });
      if(pc && pc.remoteDescription) await pc.addIceCandidate(c);
      else pendingCandidates.push(c);
    }
  }catch(err){
    console.error(err);
    setStatus("خطأ WebRTC: "+err.message);
  }
}

document.getElementById("connect").onclick=()=>{
  const id=document.getElementById("deviceId").value.trim();
  if(!id)return;
  if(socket)socket.disconnect();

  socket=io("https://signaling-server-1-zu27.onrender.com/",{transports:["websocket"]});
  socket.on("connect",()=>{
    socket.emit("join",{roomId:id,role:"viewer"});
    setStatus("متصل بالسيرفر؛ في انتظار التاب...");
  });
  socket.on("message",handleMessage);
  socket.on("disconnect",()=>setStatus("انقطع اتصال السيرفر"));
};

document.getElementById("audio").onclick=async()=>{
  try{
    await remoteAudio.play();
    await screenVideo.play();
    await cameraVideo.play();
  }catch(e){console.error(e)}
};
</script>
</body>
</html>
